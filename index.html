<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f9c2d6">
<meta name="robots" content="noindex, nofollow">
<title>교동교동 정기모임 초대장</title>
<style>
:root{
  --cream:#fff8fb; --peach:#f9c2d6; --peach-deep:#e8799f;
  --mint:#bfe3d0; --mint-deep:#8fcda9; --lav:#d9c9ec; --ink:#5c4552; --sub:#b08a9c;
  --card:#fffdfe; --line:#f6dbe6; --sky1:#ffe3ee; --sky2:#fff0f2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:linear-gradient(160deg,#fff0f5 0%,#fce3ef 45%,#f3ecf9 100%);
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:18px; padding:24px 16px 44px;
}

.floaties{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.floaty{position:absolute; font-size:30px; opacity:.16; animation:float 12s ease-in-out infinite;}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-26px) rotate(14deg);}
}

.card{
  position:relative; z-index:2; width:100%; max-width:440px; background:var(--card);
  border-radius:28px; padding:30px 26px 26px; text-align:center;
  box-shadow:0 18px 50px rgba(220,130,165,.22); border:1px solid #fbe3ee;
  animation:pop .7s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0; transform:translateY(30px) scale(.96);} to{opacity:1; transform:none;}}

.mascot-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
.mascot-thumb{width:52px; height:auto; filter:drop-shadow(0 4px 8px rgba(200,110,150,.25));
  animation:wobble 3s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}

h1{margin:4px 0 6px; font-size:24px; font-weight:800; letter-spacing:-.5px; line-height:1.3; color:#7a4a5f;}
h1 .hl{background:linear-gradient(transparent 58%, #ffd2e5 58%); padding:0 3px;}

/* ===== 게임 카드 ===== */
.game-card{position:relative; z-index:2; width:100%; max-width:440px; background:var(--card);
  border-radius:26px; padding:18px; box-shadow:0 16px 44px rgba(220,130,165,.2);
  border:1px solid #fbe3ee; animation:pop .7s cubic-bezier(.2,.9,.3,1.2);}
.game-card h3{margin:0 0 4px; font-size:16px; color:#7a4a5f; text-align:center;}
.game-card .gsub{margin:0 0 12px; font-size:12.5px; color:var(--sub); text-align:center;}

.viewport{position:relative; width:100%; height:180px; border-radius:16px; overflow:hidden;
  background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 65%, #e3ecd8 100%);
  border:1px solid #f6dfe9; touch-action:manipulation; cursor:pointer; user-select:none;}

.cloud{position:absolute; font-size:20px; opacity:.55; top:14px; animation:drift linear infinite;}
@keyframes drift{ from{transform:translateX(120%);} to{transform:translateX(-140px);} }

.world{position:absolute; left:0; top:0; height:100%; width:2000px; will-change:transform;}
.ground{position:absolute; left:0; bottom:0; width:2000px; height:28px; background:var(--mint);
  border-top:3px dashed var(--mint-deep);}

.check{position:absolute; bottom:120px; width:40px; height:40px; border-radius:12px;
  background:linear-gradient(160deg,#fff,#fdf0f5); border:2px solid #f5c7dc;
  display:flex; align-items:center; justify-content:center; font-size:18px;
  box-shadow:0 4px 10px rgba(220,130,165,.22); z-index:3; transition:transform .2s;}
.check::after{content:''; position:absolute; bottom:-92px; left:50%; transform:translateX(-50%);
  width:24px; height:7px; border-radius:50%; background:rgba(180,100,140,.14);}
.check.bonked{animation:checkbonk .45s cubic-bezier(.2,.9,.3,1.3); border-color:var(--peach-deep);
  background:linear-gradient(160deg,#fff,#fff0e4);}
@keyframes checkbonk{0%{transform:translateY(0) scale(1);}30%{transform:translateY(-14px) scale(1.4) rotate(10deg);}
  60%{transform:translateY(4px) scale(.95);}100%{transform:translateY(0) scale(1);}}

.flagpole{position:absolute; bottom:28px; font-size:36px; z-index:3; transform-origin:bottom center;}
.flagpole.popped{animation:flagwave .6s ease-in-out infinite;}
@keyframes flagwave{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}

.hero-wrap{position:absolute; left:52px; bottom:28px; z-index:5; pointer-events:none;}
.hero-wrap img{position:absolute; bottom:0; left:0; height:70px; width:auto;
  filter:drop-shadow(0 4px 6px rgba(120,90,70,.25));}
#heroRun{transform:scaleX(-1);}
#heroCelebrate{display:none;}

.bubble{position:absolute; right:8px; top:8px; max-width:188px; z-index:6; pointer-events:none;
  background:#fffdfe; border:2px solid #f5c7dc; border-radius:14px; padding:8px 10px;
  box-shadow:0 6px 14px rgba(220,130,165,.22); opacity:0; transform:scale(.85); transform-origin:right top;
  transition:opacity .25s, transform .25s, max-width .3s, padding .3s;}
.bubble.show{opacity:1; transform:scale(1);}
.bubble.final{max-width:220px; padding:11px 13px; border-radius:16px;}
.bubble::after{content:''; position:absolute; left:20px; bottom:-8px; width:0; height:0;
  border:8px solid transparent; border-top-color:#fffdfe;}
.bubble-lines{display:flex; flex-direction:column; gap:5px;}
.bubble-line{display:flex; align-items:flex-start; gap:5px; font-size:11.5px; color:var(--ink); font-weight:700;
  text-align:left; line-height:1.4; animation:pop .35s ease; transition:font-size .3s;}
.bubble-line .bl-ic{flex:0 0 auto;}
.bubble-line .bl-tx{flex:1 1 auto; min-width:0; overflow-wrap:break-word;}
.bubble.final .bubble-line{font-size:14.5px; gap:7px;}

.tap-hint{margin:8px 0 0; font-size:12px; color:var(--sub); text-align:center; font-weight:700;
  opacity:1;}

.ctrl-row{display:flex; gap:7px; margin-top:8px;}
.ctrl-btn{flex:1; border:none; padding:10px 0; border-radius:16px; font-family:inherit;
  font-size:16px; font-weight:800; color:#8a5d75; cursor:pointer;
  background:linear-gradient(160deg,#fff,#fdeef3); border:1.5px solid #f5d9e4;
  box-shadow:0 3px 8px rgba(220,130,165,.15); user-select:none; touch-action:none;
  transition:transform .1s; -webkit-user-drag:none; -webkit-touch-callout:none;}
.ctrl-btn:active{transform:scale(.94); background:#f5d9e4;}
.ctrl-btn.ctrl-jump{color:#fff; background:linear-gradient(135deg,var(--peach),var(--peach-deep));
  border:none; font-size:13.5px; box-shadow:0 4px 12px rgba(220,120,165,.32);}
.ctrl-arrow{display:flex; align-items:center; justify-content:center;}
.ctrl-arrow::before{content:''; display:block; width:0; height:0; pointer-events:none;
  border-top:8px solid transparent; border-bottom:8px solid transparent;}
.ctrl-arrow.left::before{border-right:13px solid #8a5d75; margin-right:2px;}
.ctrl-arrow.right::before{border-left:13px solid #8a5d75; margin-left:2px;}
.ctrl-arrow.up::before{border-top:0; border-bottom:15px solid #fff;
  border-left:9px solid transparent; border-right:9px solid transparent;}

.goal-box{display:none; flex-direction:column; align-items:center; gap:8px; margin-top:14px;}
.goal-box.show{display:flex; animation:pop .5s cubic-bezier(.2,.9,.3,1.2);}
.goal-btn{width:100%; border:none; padding:14px; border-radius:15px; font-family:inherit;
  font-size:15.5px; font-weight:800; color:#fff; cursor:pointer;
  background:linear-gradient(135deg,var(--peach),var(--peach-deep)); box-shadow:0 8px 20px rgba(220,120,165,.32);}

.edit-link{display:none; margin:10px auto 0; font-size:11.5px; color:#c3b3a8; text-align:center;
  background:none; border:none; font-family:inherit; text-decoration:underline; cursor:pointer; padding:4px; width:100%;}

/* ===== 게시판 ===== */
.board{position:relative; z-index:2; width:100%; max-width:440px; background:var(--card);
  border-radius:24px; padding:22px 20px; box-shadow:0 14px 40px rgba(220,130,165,.18);
  border:1px solid #fbe3ee; animation:pop .7s cubic-bezier(.2,.9,.3,1.2);}
.board h3{margin:0 0 2px; font-size:18px; color:#7a4a5f; text-align:center;}
.board-sub{margin:0 0 16px; font-size:12.5px; color:var(--sub); text-align:center; line-height:1.5;}
.board-list{display:flex; flex-direction:column; gap:10px;}
.board-empty{text-align:center; color:#cba3b5; font-size:13px; padding:16px 0; line-height:1.6;}
.post{background:#fdeef4; border-radius:14px; padding:11px 14px; border:1px solid #f5d9e4; animation:pop .4s ease;}
.post-nick{font-size:12.5px; font-weight:800; color:var(--peach-deep); margin-bottom:3px;}
.post-msg{font-size:14px; color:var(--ink); line-height:1.5; word-break:break-word; text-align:left;}
.post-tag{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:8px; margin-left:2px;}
.post-tag-yes{background:#eaf7ef; color:#3f7d5e;}
.post-tag-no{background:#fdecec; color:#b8615f;}

/* ===== 참석 입력 모달 ===== */
.modal-bg{position:fixed; inset:0; z-index:40; display:none; align-items:center;
  justify-content:center; padding:20px; background:rgba(90,55,74,.45); backdrop-filter:blur(3px);}
.modal-bg.show{display:flex; animation:fadein .3s;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.join{background:#fffdfa; width:100%; max-width:380px; border-radius:24px; padding:26px 22px;
  text-align:center; box-shadow:0 24px 60px rgba(150,100,120,.3); animation:pop .45s cubic-bezier(.2,.9,.3,1.2);}
.join h3{margin:0 0 2px; font-size:20px; color:#7a4a5f;}
.join-sub{margin:0 0 18px; font-size:13px; color:var(--sub);}
.attend-row{display:flex; gap:10px; margin-bottom:12px;}
.attend-opt{flex:1; border:1.5px solid var(--line); background:#fff; border-radius:14px;
  padding:12px 0; font-family:inherit; font-size:14.5px; font-weight:800; color:var(--sub); cursor:pointer;}
.attend-opt.sel-yes{border-color:var(--mint-deep); background:linear-gradient(160deg,#fff,#eaf7ef); color:#3f7d5e;}
.attend-opt.sel-no{border-color:#e0a8a8; background:linear-gradient(160deg,#fff,#fdecec); color:#b8615f;}
.join input, .join textarea{width:100%; border:1.5px solid var(--line); border-radius:14px;
  padding:12px 14px; font-family:inherit; font-size:15px; margin-bottom:10px; box-sizing:border-box;
  outline:none; transition:border-color .15s;}
.join input:focus, .join textarea:focus{border-color:var(--peach);}
.join textarea{min-height:80px; resize:vertical;}
.join-btn{width:100%; border:none; padding:14px; border-radius:15px; font-family:inherit;
  font-size:16px; font-weight:800; color:#fff; cursor:pointer;
  background:linear-gradient(135deg,var(--peach),var(--peach-deep)); box-shadow:0 8px 20px rgba(220,120,165,.3);}
.join-cancel{width:100%; border:none; background:none; color:var(--sub); font-family:inherit;
  font-size:13px; font-weight:700; padding:10px; margin-top:6px; cursor:pointer;}
.join-delete{display:none; width:100%; border:none; background:none; color:#c0625f; font-family:inherit;
  font-size:13px; font-weight:800; padding:8px; margin-top:2px; cursor:pointer; text-decoration:underline;}

.toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(40px);
  background:#fff; color:var(--ink); padding:13px 22px; border-radius:18px; font-weight:700;
  font-size:14px; box-shadow:0 10px 30px rgba(210,120,165,.3); opacity:0; z-index:50;
  transition:.35s; pointer-events:none; white-space:nowrap;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.confetti{position:fixed; top:-12px; z-index:45; pointer-events:none; border-radius:2px;}
.foot{margin-top:4px; font-size:11.5px; color:#c3b3a8; line-height:1.6; text-align:center;}
</style>
</head>

      <button type="button" class="attend-opt" id="attendYes" data-val="yes">참석 ✅</button>
      <button type="button" class="attend-opt" id="attendNo" data-val="no">불참 🙅</button>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBtSooSc-eg4zMHQ_QF-ErmYJmtaYT1Fkg",
  authDomain: "limi-88231.firebaseapp.com",
  projectId: "limi-88231",
  storageBucket: "limi-88231.firebasestorage.app",
  messagingSenderId: "361025367626",
  appId: "1:361025367626:web:19d4e19d54558d4a79c0b3"
};
let db=null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){ console.error('Firebase 초기화 실패', e); }

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function subscribeBoard(){
  if(!db) return;
  db.collection('gyodong_rsvp').orderBy('ts','desc').onSnapshot(snap=>{
    const list=document.getElementById('boardList');
    const title=document.getElementById('boardTitle');
    const yesCount=snap.docs.filter(d=>d.data().attend!=='no').length;
    title.textContent = snap.empty ? '💬 참가자 한마디' : `💬 참가자 한마디 (${yesCount}명 참석 확정!)`;
    if(snap.empty){ list.innerHTML='<p class="board-empty">아직 한마디가 없어요.<br>첫 번째 참가자가 되어보세요! ✨</p>'; return; }
    list.innerHTML = snap.docs.map(d=>{
      const x=d.data();
      const tag = x.attend==='no'
        ? '<span class="post-tag post-tag-no">불참</span>'
        : '<span class="post-tag post-tag-yes">참석</span>';
      return `<div class="post"><div class="post-nick">🎲 ${esc(x.nick||'익명')} ${tag}</div>`
        + `<div class="post-msg">${esc(x.msg||'')}</div></div>`;
    }).join('');
  }, err=>{
    document.getElementById('boardList').innerHTML =
      '<p class="board-empty">게시판을 불러오지 못했어요.<br>(Firestore 설정을 확인해 주세요)</p>';
    console.error('게시판 구독 오류', err);
  });
}
subscribeBoard();

let selectedAttend=null;
let currentEntryId=null;

function loadMyEntry(){
  try{ const raw=localStorage.getItem('gyodong_myEntry'); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveMyEntry(entry){
  try{ localStorage.setItem('gyodong_myEntry', JSON.stringify(entry)); }catch(e){}
}
function clearMyEntry(){
  try{ localStorage.removeItem('gyodong_myEntry'); }catch(e){}
}
function refreshEditLink(){
  document.getElementById('editLink').style.display = loadMyEntry() ? 'block' : 'none';
}
function refreshGoalBtnLabel(){
  document.getElementById('goalBtn').textContent = loadMyEntry() ? '내 참가정보 수정하기 ✏️' : '참가 신청하기 ✋';
}
refreshEditLink();
refreshGoalBtnLabel();

function setAttend(val){
  selectedAttend=val;
  document.getElementById('attendYes').classList.toggle('sel-yes', val==='yes');
  document.getElementById('attendNo').classList.toggle('sel-no', val==='no');
}
document.getElementById('attendYes').addEventListener('click', ()=>setAttend('yes'));
document.getElementById('attendNo').addEventListener('click', ()=>setAttend('no'));

function openJoin(prefill){
  currentEntryId = prefill ? prefill.id : null;
  document.getElementById('nickIn').value = prefill ? (prefill.nick||'') : '';
  document.getElementById('msgIn').value = prefill ? (prefill.msg||'') : '';
  setAttend(prefill ? (prefill.attend||null) : null);
  document.getElementById('joinTitle').textContent = prefill ? '내 참가 정보 수정' : '참가 신청 ✋';
  document.getElementById('deleteBtn').style.display = prefill ? 'block' : 'none';
  document.getElementById('joinBg').classList.add('show');
  setTimeout(()=>{ const n=document.getElementById('nickIn'); if(n) n.focus(); }, 100);
}
function closeJoin(){ document.getElementById('joinBg').classList.remove('show'); }
document.getElementById('cancelBtn').addEventListener('click', closeJoin);
document.getElementById('joinBg').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeJoin(); });

document.getElementById('editLink').addEventListener('click', ()=>{
  const mine=loadMyEntry();
  if(mine) openJoin(mine);
});

document.getElementById('deleteBtn').addEventListener('click', ()=>{
  if(!currentEntryId || !db) return;
  db.collection('gyodong_rsvp').doc(currentEntryId).delete().then(()=>{
    clearMyEntry();
    currentEntryId=null;
    refreshEditLink();
    refreshGoalBtnLabel();
    closeJoin();
    showToast('신청 내용을 삭제했어요');
  }).catch(e=>{
    showToast('삭제 실패 😢 다시 시도해 주세요');
    console.error(e);
  });
});

function submitJoin(){
  if(!selectedAttend){ showToast('✏️ 참석 여부를 선택해주세요!'); return; }
  const attend=selectedAttend;
  const nick=document.getElementById('nickIn').value.trim() || '익명';
  const msg=document.getElementById('msgIn').value.trim();
  if(attend==='yes' && !msg){ showToast('✏️ 기대 한줄평을 적어주세요!'); return; }
  if(!db){ showToast('⚠️ 게시판 연결이 아직이에요'); return; }
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='저장하는 중…';
  const payload={ nick, msg, attend, ts: firebase.firestore.FieldValue.serverTimestamp() };
  const savePromise = currentEntryId
    ? db.collection('gyodong_rsvp').doc(currentEntryId).set(payload, {merge:true}).then(()=>currentEntryId)
    : db.collection('gyodong_rsvp').add(payload).then(docRef=>docRef.id);
  savePromise.then(id=>{
    saveMyEntry({id, nick, msg, attend});
    refreshEditLink();
    refreshGoalBtnLabel();
    closeJoin();
    document.getElementById('nickIn').value='';
    document.getElementById('msgIn').value='';
    setAttend(null);
    if(attend==='yes'){ dropConfetti(110); showToast('🎉 저장 완료! 화요일에 만나요~'); }
    else{ showToast('아쉽지만 다음에 꼭 함께해요!'); }
  }).catch(e=>{
    showToast('앗, 저장 실패 😢 다시 시도해 주세요');
    console.error(e);
  }).finally(()=>{ btn.disabled=false; btn.textContent='신청 완료 🎉'; });
}
document.getElementById('submitBtn').addEventListener('click', submitJoin);

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* 떠다니는 배경 */
(function(){
  const icons=['🎲','🃏','🧩','🎯','♟️','🎮'];
  const wrap=document.getElementById('floaties');
  for(let i=0;i<12;i++){
    const s=document.createElement('span');
    s.className='floaty';
    s.textContent=icons[i%icons.length];
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.fontSize=(22+Math.random()*28)+'px';
    s.style.animationDelay=(Math.random()*8)+'s';
    s.style.animationDuration=(9+Math.random()*8)+'s';
    wrap.appendChild(s);
  }
})();

/* 컨페티 */
function dropConfetti(count){
  count = count || 40;
  const colors=['#f9c2d6','#ffd9e6','#f6a5c0','#e8799f','#d9c9ec','#bfe3d0'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const size=6+Math.random()*8;
    c.style.width=size+'px'; c.style.height=(size*1.4)+'px';
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.opacity=.85;
    document.body.appendChild(c);
    const fall=1400+Math.random()*1400;
    const drift=(Math.random()*160-80);
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${drift}px, 110vh) rotate(${Math.random()*720-360}deg)`, opacity:.9}
    ],{duration:fall, easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish=()=>c.remove();
  }
}

/* ===== 미니 러너 게임 ===== */
const ITEMS = [
  {type:'check', x:420, icon:'📅', label:'일시', value:'7월 21일(화) 퇴근 후'},
  {type:'check', x:820, icon:'📍', label:'장소', value:'수유역 레드버튼'},
  {type:'check', x:1220, icon:'💬', label:'안내', value:'늦참·조퇴 모두 환영이에요!'},
  {type:'flag', x:1500}
];
const HERO_X=52, MOVE_SPEED=170, GRAVITY=1900, JUMP_V=640, HIT_RANGE=26, HEAD_HIT_Y=55;

const world=document.getElementById('world');
const hero=document.getElementById('heroRun');
const heroCelebrate=document.getElementById('heroCelebrate');
const heroWrap=document.querySelector('.hero-wrap');
const viewport=document.getElementById('viewport');
const tapHint=document.getElementById('tapHint');
const bubble=document.getElementById('bubble');
const bubbleLines=document.getElementById('bubbleLines');
const goalBox=document.getElementById('goalBox');
const joinBg=document.getElementById('joinBg');

ITEMS.forEach(item=>{
  const el=document.createElement('div');
  el.style.left=item.x+'px';
  if(item.type==='check'){
    el.className='check';
    el.textContent='❔';
  }else if(item.type==='flag'){
    el.className='flagpole';
    el.textContent='🚩';
  }
  world.appendChild(el);
  item.el=el;
});

let worldX=0, heroY=0, heroVY=0, isJumping=false, running=true, finished=false, lastT=null;
const keys={left:false, right:false};

function isTypingContext(){
  const active=document.activeElement;
  if(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA')) return true;
  return joinBg.classList.contains('show');
}

function jump(){
  if(finished || !running) return;
  if(!isJumping){ isJumping=true; heroVY=JUMP_V; }
}
viewport.addEventListener('pointerdown', jump);

function bindHold(el, onDown, onUp){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    onDown();
  });
  ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev, onUp));
}
bindHold(document.getElementById('btnLeft'), ()=>keys.left=true, ()=>keys.left=false);
bindHold(document.getElementById('btnRight'), ()=>keys.right=true, ()=>keys.right=false);
document.getElementById('btnJump').addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); jump(); });

document.addEventListener('keydown', e=>{
  if(isTypingContext()) return;
  if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); jump(); return; }
  if(e.code==='ArrowRight' || e.code==='KeyD'){ e.preventDefault(); keys.right=true; return; }
  if(e.code==='ArrowLeft' || e.code==='KeyA'){ e.preventDefault(); keys.left=true; return; }
});
document.addEventListener('keyup', e=>{
  if(e.code==='ArrowRight' || e.code==='KeyD') keys.right=false;
  if(e.code==='ArrowLeft' || e.code==='KeyA') keys.left=false;
});

function revealInvite(){
  document.getElementById('inviteCard').style.display='block';
  document.getElementById('boardSection').style.display='block';
  document.getElementById('footNote').style.display='block';
}

document.getElementById('goalBtn').addEventListener('click', e=>{
  e.stopPropagation();
  openJoin(loadMyEntry());
});

function addBubbleLine(item){
  bubble.classList.add('show');
  const div=document.createElement('div');
  div.className='bubble-line';
  div.innerHTML = `<span class="bl-ic">${item.icon}</span><span class="bl-tx">${esc(item.value)}</span>`;
  bubbleLines.appendChild(div);
}

function popCheckpoint(item){
  item.triggered=true;
  item.el.classList.add('bonked');
  item.el.textContent=item.icon;
  addBubbleLine(item);
  dropConfetti(22);
}

function checkNextCheck(){
  const nc=ITEMS.find(it=>it.type==='check' && !it.triggered);
  if(!nc) return false;
  const screenX=nc.x+worldX;
  if(screenX>HERO_X+HIT_RANGE) return false;
  if(isJumping && heroY>HEAD_HIT_Y){
    popCheckpoint(nc);
    return false;
  }
  return true;
}

function checkFlag(){
  const flag=ITEMS.find(it=>it.type==='flag');
  if(!flag || flag.triggered) return;
  const screenX=flag.x+worldX;
  if(screenX<=HERO_X){
    flag.triggered=true;
    reachGoal(flag);
  }
}

function reachGoal(item){
  finished=true;
  item.el.classList.add('popped');
  dropConfetti(90);
  tapHint.style.display='none';
  document.getElementById('ctrlRow').style.display='none';
  setTimeout(()=>{
    hero.style.display='none';
    heroCelebrate.style.display='block';
    bubble.classList.add('final');
    revealInvite();
    goalBox.classList.add('show');
  }, 260);
}

function loop(t){
  if(lastT===null) lastT=t;
  const dt=Math.min((t-lastT)/1000, 0.05);
  lastT=t;

  let moving=false;
  if(running && !finished){
    const blocked=checkNextCheck();
    let dx=0;
    if(keys.right) dx -= MOVE_SPEED*dt;
    if(keys.left) dx += MOVE_SPEED*dt;
    if(dx<0 && blocked) dx=0;
    if(dx!==0){
      worldX = Math.min(0, worldX+dx);
      world.style.transform = `translateX(${worldX}px)`;
      moving=true;
    }
    checkFlag();
  }

  if(isJumping){
    heroVY -= GRAVITY*dt;
    heroY += heroVY*dt;
    if(heroY<=0){ heroY=0; heroVY=0; isJumping=false; }
  }

  const bob = (!isJumping && moving) ? Math.abs(Math.sin(t/110))*5 : 0;
  const rotate = isJumping ? Math.max(-16, Math.min(16, heroVY/40)) : (moving ? Math.sin(t/110)*3 : 0);
  heroWrap.style.transform = `translateY(${-(heroY+bob)}px) rotate(${rotate}deg)`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
